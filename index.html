<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Bản đồ số xã Triệu Cơ</title>
    <meta name="description" content="Bản đồ số xã Triệu Cơ, tỉnh Quảng Trị: UBND, công an, trạm y tế, trường học, chợ, cây xăng..." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=20261106" />
  </head>
  <body>
    <header class="header">
      <span class="emblem">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m12 2.5 2.6 7.2h7.6l-6.2 4.6 2.4 7.3L12 17.1l-6.4 4.5 2.4-7.3-6.2-4.6h7.6Z" fill="#FFDD00" />
        </svg>
      </span>
      <div>
        <h1 id="title">Bản đồ số</h1>
        <p id="subtitle"></p>
      </div>
    </header>

    <main class="stage">
      <div id="map"></div>

      <div class="search-box">
        <label class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input id="search" type="search" placeholder="Tìm kiếm địa điểm..." autocomplete="off" />
          <button type="button" id="search-clear" class="search-clear" aria-label="Xoá" hidden>✕</button>
        </label>
        <ul class="results" id="results" hidden></ul>
        <button type="button" class="filter-chip" id="filter-chip" hidden></button>
      </div>

      <div class="controls">
        <button type="button" class="ctrl" id="zoom-in" title="Phóng to">+</button>
        <button type="button" class="ctrl" id="zoom-out" title="Thu nhỏ">−</button>
        <button type="button" class="ctrl" id="toggle-layer" title="Bản đồ / Vệ tinh">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="m12 3 9 5-9 5-9-5 9-5Z" />
            <path d="m3 13 9 5 9-5M3 17.5l9 5 9-5" />
          </svg>
        </button>
        <button type="button" class="ctrl" id="open-stats" title="Thống kê">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 20h16M7 16v-5M12 16V6M17 16v-8" />
          </svg>
        </button>
        <button type="button" class="ctrl" id="locate" title="Vị trí của tôi">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="7" />
            <circle cx="12" cy="12" r="2.5" />
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
          </svg>
        </button>
        <button type="button" class="ctrl" id="fit-boundary" title="Về ranh giới xã">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" />
            <circle cx="12" cy="12" r="5" />
            <path d="M12 12 18 6" />
          </svg>
        </button>
      </div>

      <div class="bottom-left">
        <button type="button" class="category-btn" id="open-categories">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" />
          </svg>
          Danh mục
        </button>
        <label class="label-switch">
          <input type="checkbox" id="toggle-labels" role="switch" checked />
          <span class="switch-track" aria-hidden="true"></span>
          Tên địa điểm
        </label>
      </div>

      <p class="demo-note">Toạ độ: khảo sát thực địa, Google Maps, OpenStreetMap</p>
    </main>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet-panel" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        <div class="sheet-head" id="sheet-head" hidden>
          <h2 id="sheet-title"></h2>
          <button type="button" class="icon-btn" data-close aria-label="Đóng">✕</button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="boundary.js?v=1793949740"></script>
    <script src="data.js?v=1794209042"></script>
    <script src="app.js?v=1794209150"></script>
  </body>
</html>
